name: Verificar JB360 comercial
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Comprobar operaciones comerciales
        run: node tests/smoke.cjs
