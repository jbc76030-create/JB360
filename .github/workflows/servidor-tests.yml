name: JB360 servidor
on:
  push:
    branches: [servidor-2026-en-revision]
    paths: ["servidor/**", ".github/workflows/servidor-tests.yml"]
  pull_request:
    paths: ["servidor/**", ".github/workflows/servidor-tests.yml"]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r servidor/requirements.txt
      - run: python -m pytest -q
        working-directory: servidor
