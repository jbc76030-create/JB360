<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JB Gestión Empresarial 360 · Comercial</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17304a;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}header{background:#102b48;color:white;padding:18px 4%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}header small{display:block;color:#b7d4eb}nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 4%;background:white;border-bottom:1px solid #dce3ec}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:#1265a8;color:white;margin:3px}button.alt,nav button{background:#e8f0f9;color:#173858}nav button.active{background:#1265a8;color:white}main{max-width:1250px;margin:22px auto;padding:0 15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card,.panel{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:17px;margin-bottom:14px}.card strong{font-size:23px;display:block;margin-top:7px}.muted{color:#64768a;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}input,select{width:100%;padding:10px;border:1px solid #b9c8d7;border-radius:7px;margin:5px 0 10px;font:inherit}label{font-size:13px;font-weight:600}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e4e9ef;padding:9px;font-size:13px}th{background:#f4f7fb}.scroll{overflow-x:auto}.notice{background:#fff4d9;padding:12px;border-radius:9px;font-size:13px}.ok{color:#167345}.bad{color:#b42b36}h1{font-size:23px}h2{font-size:18px}footer{text-align:center;padding:24px;color:#697a8c;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar label{min-width:155px}.toolbar input,.toolbar select{margin-bottom:0}.pill{display:inline-block;background:#eaf2fc;border-radius:18px;padding:5px 10px;font-size:12px}.right{text-align:right}#printArea{display:none}@media print{header,nav,main,footer{display:none!important}#printArea{display:block!important;padding:10mm;color:black;font:11pt Arial}#printArea h1{font-size:18pt}#printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border:1px solid #888;padding:6px;font-size:9pt}#printArea .right{text-align:right}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb84c;outline-offset:2px}button:hover{filter:brightness(.94)}.card{box-shadow:0 5px 18px #16334a0a}.panel{box-shadow:0 2px 12px #16334a08}nav{position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #17304a0a}@media(max-width:650px){header{padding:16px}nav{overflow-x:auto;flex-wrap:nowrap;padding:9px;scrollbar-width:thin}nav button{white-space:nowrap;flex-shrink:0}main{margin:14px auto;padding:0 10px}.panel{padding:13px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.card strong{font-size:18px;overflow-wrap:anywhere}td,th{white-space:nowrap}button{min-height:42px}}@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}}
</style></head><body><header><div><b>JB GESTIÓN EMPRESARIAL 360</b><small>Gestión comercial · Ventas, existencias y reportes</small></div><div>● Datos en este navegador</div></header><nav id="nav"></nav><main id="main"></main><div id="printArea"></div><footer>Datos guardados en este navegador. Respalda periódicamente; los cobros bancarios requieren conciliación.</footer><script>
'use strict';const KEY='jb360_demo_v1';const seed=()=>({products:[],sales:[],services:[],cash:[],expenses:[],inventory:[],bank:[],reservations:[],suppliers:[],recipes:[],audits:[],refundEvents:[],bankReconciliation:[],settings:{business:'Mi negocio',currency:'CUP'}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}function normalize(){for(const k of ['products','sales','services','cash','expenses','inventory','bank','reservations','suppliers','recipes','audits','refundEvents','bankReconciliation'])if(!Array.isArray(db[k]))db[k]=[];db.settings??={business:'Mi negocio',currency:'CUP'};db.services.forEach(p=>{p.cost=Number(p.cost)||0;p.price=Number(p.price)||0});db.products.forEach(p=>{p.category??='General';p.min??=0;p.stock=Number(p.stock)||0;p.cost=Number(p.cost)||0;p.price=Number(p.price)||0});db.sales.forEach(s=>{s.costTotal??=Math.max(0,(Number(s.total)||0)-(Number(s.profit)||0));s.refundQty??=0;s.refundTotal??=0;s.refundCost??=0;s.refunds??=[];});}normalize();let tab='Panel',report='ventas',from='',to='',cart=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('es-CU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' CUP';const num=n=>Number(n)||0;const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const timestamp=()=>{const d=new Date(),z=-d.getTimezoneOffset(),sign=z>=0?'+':'-',pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(Math.floor(Math.abs(z)/60))}:${pad(Math.abs(z)%60)}`};const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const inRange=x=>{const d=String(x.date||'').slice(0,10);return(!from||d>=from)&&(!to||d<=to)};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('No se pudo guardar. Exporta un respaldo y comprueba el almacenamiento disponible.');return false}};const net=s=>num(s.total)-num(s.refundTotal);const cost=s=>num(s.costTotal)-num(s.refundCost);const sales=()=>db.sales.filter(inRange).map(s=>{const rs=(s.refunds||[]).filter(r=>inRange(r));return {...s,refundQty:sum(rs,r=>num(r.qty)),refundTotal:sum(rs,r=>num(r.amount)),refundCost:sum(rs,r=>num(r.cost))}});const expenses=()=>db.expenses.filter(inRange);const sum=(xs,f)=>xs.reduce((a,x)=>a+f(x),0);const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${heads.length}">Sin registros en el período</td></tr>`}</tbody></table></div>`;const pOptions=()=>db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${p.stock})</option>`).join('');function netPayment(s,m){const paid=s.method==='Mixto'?num(s[m==='Efectivo'?'paymentCash':m==='Transferencia'?'paymentTransfer':'paymentCard']):s.method===m?num(s.total):0;const returned=sum(s.refunds||[],r=>num(r.allocation?.[m]??(r.method===m?r.amount:0)));return Math.round((paid-returned)*100)/100}
function totals(){const ss=db.sales;const revenue=sum(ss,net),cogs=sum(ss,cost),exp=sum(db.expenses,x=>num(x.amount)),cash=sum(db.cash,x=>x.type==='salida'?-num(x.amount):num(x.amount)),bank=sum(db.bank,x=>x.refundId?0:x.type==='salida'?-num(x.amount):num(x.amount))+sum(ss,s=>netPayment(s,'Transferencia')+netPayment(s,'Tarjeta'));return{revenue,cogs,exp,profit:revenue-cogs-exp,cash,bank,stock:sum(db.products,p=>num(p.stock))}}function go(t){tab=t;render()}function formField(name,label,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function render(){const tabs=['Panel','Productos','Servicios','Ventas','Caja y Banco','Gastos','Reservas','Arqueo','Informes','Tributos','Respaldo'];$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');const t=totals();let h='';if(tab==='Panel'){const low=db.products.filter(p=>p.stock<=p.min);h=`<h1>Panel de dirección</h1><div class="cards">${[['Ventas netas (bienes + servicios)',money(t.revenue)],['Costos directos de ventas y servicios',money(t.cogs)],['Gastos',money(t.exp)],['Utilidad estimada',money(t.profit)],['Efectivo en caja',money(t.cash)],['Cobros electrónicos declarados (no conciliados)',money(t.bank)],['Unidades en existencia',t.stock]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>Alertas de existencias</h2>${low.length?low.map(p=>`<p class="bad">${esc(p.name)}: ${p.stock} unidades (mínimo ${p.min})</p>`).join(''):'<p class="ok">Sin productos por debajo del mínimo.</p>'}</div><p class="notice">Los cobros bancarios son importes registrados, no saldos confirmados por el banco. La utilidad es una estimación comercial: no incluye impuestos, depreciación ni ajustes contables no registrados.</p>`}
if(tab==='Productos'){h=`<h1>Productos y existencias</h1><div class="grid"><div class="panel"><h2>Agregar producto</h2><form onsubmit="addProduct(event)">${formField('id','Código')}${formField('name','Descripción')}${formField('category','Categoría')}${formField('price','Precio CUP','number','min="0" step="0.01"')}${formField('cost','Costo CUP','number','min="0" step="0.01"')}${formField('stock','Existencia inicial','number','min="0" step="1"')}${formField('min','Existencia mínima','number','min="0" step="1"')}<button>Guardar producto</button></form></div><div class="panel"><h2>Movimiento de inventario</h2><form onsubmit="adjust(event)"><label>Producto<select name="id">${pOptions()}</select></label><label>Movimiento<select name="type"><option value="entrada">Entrada</option><option value="rebaja">Rebaja</option><option value="faltante">Faltante</option></select></label>${formField('qty','Cantidad','number','min="1" step="1"')}<label>Motivo<input name="concept" placeholder="Compra, merma, conteo..."></label><button>Registrar movimiento</button></form><h2>Cambio masivo de precios</h2><form onsubmit="bulkPrice(event)">${formField('percent','Variación porcentual (ej. 10 o -5)','number','step="0.01"')}<button class="alt">Aplicar a todos los productos</button></form></div></div><div class="panel"><h2>Existencias actuales</h2>${table(['Código','Producto','Categoría','Precio','Costo','Stock','Mínimo','Valor al costo'],db.products.map(p=>[esc(p.id),esc(p.name),esc(p.category),money(p.price),money(p.cost),p.stock,p.min,money(p.stock*p.cost)]))}</div>`}
if(tab==='Productos'&&db.products.length){let p=db.products[0];h+=`<div class="panel"><h2>Actualizar ficha de producto</h2><form onsubmit="updateProduct(event)"><label>Código<select name="id" onchange="loadProductEdit(this.form)">${db.products.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.name)}</option>`).join('')}</select></label><label>Descripción<input name="name" value="${esc(p.name)}" required></label><label>Categoría<input name="category" value="${esc(p.category)}" required></label><label>Precio CUP<input name="price" type="number" min="0" step="0.01" value="${p.price}" required></label><label>Costo unitario CUP<input name="cost" type="number" min="0" step="0.01" value="${p.cost}" required></label><label>Existencia mínima<input name="min" type="number" min="0" step="1" value="${p.min}" required></label><button>Guardar cambios</button></form><p class="muted">Para cambiar existencias usa Movimiento de inventario. Los cambios de precio y costo no modifican ventas históricas.</p></div>`}
if(tab==='Servicios'){h=`<h1>Catálogo de servicios y costos</h1><div class="grid"><div class="panel"><h2>Registrar servicio</h2><form onsubmit="addService(event)">${formField('id','Código del servicio')}${formField('name','Descripción')}${formField('category','Categoría')}${formField('price','Tarifa por servicio CUP','number','min="0" step="0.01"')}${formField('cost','Costo directo unitario CUP','number','min="0" step="0.01"')}<label>Detalle del costo (materiales, mano de obra, otros)<input name="detail" placeholder="Ej. insumos 200; mano de obra 300"></label><button>Guardar servicio</button></form></div><div class="panel"><h2>Cómo se calcula la utilidad</h2><p>Ingreso por servicio − costo directo del servicio = margen bruto.</p><p>Los gastos generales se registran en «Gastos» y se descuentan después, en el estado de resultados.</p><p class="notice">El costo unitario se congela en cada venta. Los servicios no descuentan inventario automáticamente. Para descontar insumos por receta se requiere una fase adicional.</p></div></div><div class="panel"><h2>Servicios disponibles</h2>${table(['Código','Servicio','Categoría','Precio','Costo directo','Margen unitario','Composición de costo'],db.services.map(x=>[esc(x.id),esc(x.name),esc(x.category),money(x.price),money(x.cost),money(x.price-x.cost),esc(x.detail||'No detallado')]))}</div>`}
if(tab==='Servicios'&&db.services.length){let p=db.services[0];h+=`<div class="panel"><h2>Actualizar ficha de servicio</h2><form onsubmit="updateService(event)"><label>Código<select name="id" onchange="loadServiceEdit(this.form)">${db.services.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.name)}</option>`).join('')}</select></label><label>Descripción<input name="name" value="${esc(p.name)}" required></label><label>Categoría<input name="category" value="${esc(p.category)}" required></label><label>Tarifa CUP<input name="price" type="number" min="0" step="0.01" value="${p.price}" required></label><label>Costo directo CUP<input name="cost" type="number" min="0" step="0.01" value="${p.cost}" required></label><label>Detalle del costo<input name="detail" value="${esc(p.detail||'')}"></label><button>Guardar cambios</button></form><p class="muted">Los cambios no modifican las ventas anteriores.</p></div>`}
if(tab==='Ventas'){h=`<h1>Punto de venta multiproducto y servicios</h1><div class="grid"><div class="panel"><h2>Agregar al comprobante</h2><form onsubmit="cartAdd(event)"><label>Artículo o servicio<select name="item">${db.products.map(p=>`<option value="P:${esc(p.id)}">Producto · ${esc(p.name)} · ${money(p.price)} · Stock ${p.stock}</option>`).join('')}${db.services.map(p=>`<option value="S:${esc(p.id)}">Servicio · ${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select></label>${formField('qty','Cantidad','number','min="1" step="1"')}<button>Agregar</button></form><p class="muted">Los servicios no tienen existencias; los productos sí requieren stock suficiente.</p></div><div class="panel"><h2>Comprobante en preparación</h2>${table(['Concepto','Cantidad','Importe','Quitar'],cart.map((x,i)=>[esc(x.name),x.qty,money(x.price*x.qty),`<button class="alt" onclick="cartRemove(${i})">Quitar</button>`]))}<p><b>Total: ${money(sum(cart,x=>x.price*x.qty))}</b></p><form onsubmit="checkout(event)"><label>Medio de pago<select name="method" onchange="paymentChange(this.value)"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mixto</option></select></label><div id="mixedFields" style="display:none"><label>Parte en efectivo CUP<input name="cashAmount" type="number" min="0" step="0.01" value="0"></label><label>Parte por transferencia CUP<input name="transferAmount" type="number" min="0" step="0.01" value="0"></label><label>Parte por tarjeta CUP<input name="cardAmount" type="number" min="0" step="0.01" value="0"></label></div><label>Vendedor<input name="seller" value="Principal" maxlength="80"></label><button ${cart.length?'':'disabled'}>Cobrar y registrar comprobante</button></form></div></div><div class="panel"><h2>Devoluciones</h2><form onsubmit="refund(event)"><label>Venta<select name="id">${db.sales.filter(s=>s.qty>s.refundQty).map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${s.qty-s.refundQty} disponibles · ${esc(s.id.slice(0,8))}</option>`).join('')}</select></label>${formField('qty','Cantidad a devolver','number','min="1" step="1"')}<button class="alt">Procesar devolución</button></form><p class="muted">El reembolso se distribuye entre los medios del cobro original; verifica su ejecución real en caja y banco.</p></div><div class="panel"><h2>Últimas operaciones</h2>${table(['Fecha','Tipo','Concepto','Cantidad','Pago','Ingreso neto','Comprobante'],db.sales.slice(-35).reverse().map(s=>[esc(new Date(s.date).toLocaleString('es-CU')),s.kind==='service'?'Servicio':'Producto',esc(s.name),s.qty,esc(s.method),money(net(s)),`<button class="alt" onclick="receipt('${esc(s.id)}')">Imprimir</button>`]))}</div>`}
if(tab==='Caja y Banco'){h=`<h1>Caja y banco</h1><div class="cards"><div class="card">Efectivo calculado<strong>${money(t.cash)}</strong></div><div class="card">Cobros electrónicos netos registrados<strong>${money(sum(db.sales,s=>netPayment(s,'Transferencia')+netPayment(s,'Tarjeta')))}</strong></div><div class="card">Banco registrado (estimado)<strong>${money(t.bank)}</strong></div></div><div class="grid"><div class="panel"><h2>Movimiento de caja</h2><form onsubmit="cashMove(event)"><label>Tipo<select name="type"><option value="entrada">Entrada / apertura</option><option value="salida">Salida / extracción</option></select></label>${formField('amount','Importe CUP','number','min="0.01" step="0.01"')}${formField('concept','Concepto')}<button>Guardar movimiento</button></form></div><div class="panel"><h2>Movimiento bancario manual</h2><form onsubmit="bankMove(event)"><label>Tipo<select name="type"><option value="entrada">Depósito / entrada</option><option value="salida">Pago / salida</option></select></label>${formField('amount','Importe CUP','number','min="0.01" step="0.01"')}${formField('concept','Concepto')}<button>Guardar movimiento</button></form></div></div><p class="notice">Las transferencias y tarjetas se contabilizan como cobros electrónicos registrados. El saldo real en banco requiere estado bancario, conciliación, comisiones y comprobación de acreditación. Evita duplicar depósitos que ya figuren como cobros electrónicos.</p>`}
if(tab==='Gastos'){h=`<h1>Costos y gastos</h1><div class="grid"><div class="panel"><h2>Registrar gasto</h2><form onsubmit="addExpense(event)">${formField('concept','Descripción')}${formField('category','Categoría (electricidad, alquiler, salario...)')}${formField('amount','Importe CUP','number','min="0.01" step="0.01"')}<label>Forma de pago<select name="method"><option>Efectivo</option><option>Banco</option><option>Pendiente</option></select></label><button>Registrar gasto</button></form></div><div class="panel"><h2>Resumen de costos</h2><p>Costo de mercancías vendidas: <b>${money(t.cogs)}</b></p><p>Gastos registrados: <b>${money(t.exp)}</b></p><p>Resultado comercial estimado: <b>${money(t.profit)}</b></p><p class="notice">Los costos se congelan al momento de la venta. Los gastos pendientes afectan el resultado, pero no caja ni banco hasta su pago.</p></div></div><div class="panel">${table(['Fecha','Concepto','Categoría','Pago','Importe'],db.expenses.slice().reverse().map(x=>[esc(x.date.slice(0,10)),esc(x.concept),esc(x.category),esc(x.method),money(x.amount)]))}</div>`}
if(tab==='Reservas'){h=`<h1>Reservas básicas</h1><div class="grid"><div class="panel"><form onsubmit="addReservation(event)">${formField('client','Cliente')}${formField('resource','Recurso (mesa, habitación, especialista)')}${formField('date','Fecha','date')}${formField('time','Hora','time')}${formField('duration','Duración en minutos','number','min="1" step="1"')}<button>Guardar reserva</button></form></div><div class="panel"><p class="notice">Se evita el solapamiento de reservas activas del mismo recurso. No incluye todavía capacidad múltiple ni notificaciones automáticas.</p></div></div><div class="panel">${table(['Fecha','Hora','Cliente','Recurso','Duración','Estado','Acción'],db.reservations.map(x=>[esc(x.date),esc(x.time),esc(x.client),esc(x.resource),x.duration,esc(x.status),`<button class="alt" onclick="toggleReservation('${esc(x.id)}')">${x.status==='Cancelada'?'Reactivar':'Cancelar'}</button>`]))}</div>`}
if(tab==='Arqueo'){const t=totals(),last=db.audits.at(-1);h=`<h1>Arqueo de efectivo</h1><div class="grid"><div class="panel"><h2>Conteo físico</h2><p>Saldo teórico: <b>${money(t.cash)}</b></p><form onsubmit="auditCash(event)">${formField('counted','Efectivo físico contado (CUP)','number','min="0" step="0.01"')}${formField('operator','Responsable del arqueo')}<button>Registrar arqueo</button></form><p class="notice">El arqueo registra la diferencia, pero no modifica el saldo teórico. Cualquier ajuste debe justificarse mediante un movimiento de caja.</p></div><div class="panel"><h2>Último arqueo</h2>${last?`<p>Fecha: ${esc(last.date)}</p><p>Responsable: ${esc(last.operator)}</p><p>Teórico: ${money(last.expected)}</p><p>Contado: ${money(last.counted)}</p><p>Diferencia: <strong class="${Math.abs(last.difference)<.005?'ok':'bad'}">${money(last.difference)}</strong></p>`:'<p>No se ha realizado ningún arqueo.</p>'}</div></div><div class="panel"><h2>Historial de arqueos</h2>${table(['Fecha','Responsable','Saldo teórico','Contado','Diferencia'],db.audits.slice().reverse().map(x=>[esc(new Date(x.date).toLocaleString('es-CU')),esc(x.operator),money(x.expected),money(x.counted),money(x.difference)]))}</div>`}
if(tab==='Informes'){h=`<h1>Centro de informes imprimibles</h1><div class="panel"><div class="toolbar"><label>Desde<input id="from" type="date" value="${esc(from)}" onchange="changeRange()"></label><label>Hasta<input id="to" type="date" value="${esc(to)}" onchange="changeRange()"></label><label>Informe<select id="rtype" onchange="changeReport()">${[['ventas','Ventas por fecha y pago'],['devoluciones','Devoluciones por fecha real'],['productos','Ventas por producto'],['servicios','Ventas y rentabilidad de servicios'],['existencias','Existencias y valoración'],['ingresos','Ingresos y cobros'],['costos','Costos directos de bienes y servicios'],['gastos','Gastos'],['resultado','Estado de resultados'],['caja','Arqueo y efectividad de caja'],['banco','Cobros por transferencia y tarjeta'],['inventario','Movimientos de inventario'],['vendedores','Ventas por vendedor'],['reservas','Reservas'],['arqueos','Historial de arqueos']].map(([v,l])=>`<option value="${v}" ${v===report?'selected':''}>${l}</option>`).join('')}</select></label><button onclick="printReport()">Imprimir / Guardar PDF</button><button class="alt" onclick="csvReport()">Exportar CSV</button></div></div><div class="panel" id="reportPreview">${reportData().html}</div><p class="notice">Selecciona «Imprimir / Guardar PDF» y usa la opción «Guardar como PDF» del navegador. Los resultados son operativos y dependen de los registros introducidos.</p>`}
if(tab==='Tributos'){const ss=periodSales(),es=expenses(),income=sum(ss,s=>num(s.total)),spend=sum(es,x=>num(x.amount));h=`<h1>Libro auxiliar para revisión tributaria</h1><div class="cards"><div class="card">Ingresos netos registrados<strong>${money(income)}</strong></div><div class="card">Gastos registrados<strong>${money(spend)}</strong></div><div class="card">Diferencia auxiliar<strong>${money(income-spend)}</strong></div></div><div class="panel"><p>Consulta el perfil económico configurado arriba y conserva los comprobantes de cada operación. Las devoluciones se reflejan en la fecha en que ocurrieron.</p><button onclick="exportAuxBook('ingresos')">Descargar ingresos CSV</button><button class="alt" onclick="exportAuxBook('gastos')">Descargar gastos CSV</button><p><a href="https://www.onat.gob.cu/" target="_blank" rel="noopener noreferrer">Portal oficial de la ONAT</a></p></div><p class="notice">Este libro es auxiliar. La clasificación de gastos, impuestos, plazos y casillas de declaraciones requiere revisión del régimen aplicable; la aplicación no genera ni presenta declaraciones oficiales.</p>`}
if(tab==='Respaldo'){h=`<h1>Respaldo y mantenimiento</h1><div class="panel"><p>Tus datos anteriores permanecen disponibles cuando usas la misma dirección y el mismo navegador. Para trasladar datos entre dispositivos, usa respaldo e importación.</p><button onclick="backup()">Descargar respaldo JSON</button><h2>Restaurar</h2><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="notice">Importar reemplaza los datos actuales. Haz un respaldo antes.</p><button class="alt" onclick="reset()">Borrar datos comerciales de este navegador</button><p class="notice">Antes de actualizar, descarga una copia de seguridad. El respaldo contiene los datos comerciales y el perfil económico; consérvalo en un lugar seguro.</p></div>`} $('main').innerHTML=h}
function loadProductEdit(form){const p=db.products.find(x=>x.id===form.elements.id.value);if(!p)return;for(const k of ['name','category','price','cost','min'])form.elements[k].value=p[k]}
function updateProduct(e){e.preventDefault();const f=e.target.elements,p=db.products.find(x=>x.id===f.id.value),price=Number(f.price.value),cost=Number(f.cost.value),min=Number(f.min.value),name=f.name.value.trim(),category=f.category.value.trim();if(!p||!name||!category||!Number.isFinite(price)||price<0||!Number.isFinite(cost)||cost<0||!Number.isInteger(min)||min<0)return alert('Datos de producto inválidos');Object.assign(p,{name,category,price,cost,min});save();render()}

function updateService(e){e.preventDefault();const f=e.target.elements,p=db.services.find(x=>x.id===f.id.value),price=Number(f.price.value),cost=Number(f.cost.value),name=f.name.value.trim(),category=f.category.value.trim();if(!p||!name||!category||!Number.isFinite(price)||price<0||!Number.isFinite(cost)||cost<0)return alert('Datos de servicio inválidos');Object.assign(p,{name,category,price,cost,detail:f.detail.value.trim()});save();render()}
function addService(e){e.preventDefault();let f=e.target.elements;let p={id:f.id.value.trim(),name:f.name.value.trim(),category:f.category.value.trim(),price:Number(f.price.value),cost:Number(f.cost.value),detail:f.detail.value.trim()};if(!p.id||!p.name||!Number.isFinite(p.price)||!Number.isFinite(p.cost)||p.price<0||p.cost<0||db.services.some(x=>x.id===p.id))return alert('Código repetido o datos inválidos');db.services.push(p);save();render()}
function cartAdd(e){e.preventDefault();let f=e.target.elements,[kind,id]=f.item.value.split(':'),p=(kind==='P'?db.products:db.services).find(x=>x.id===id),qty=Number(f.qty.value);if(!p||!Number.isInteger(qty)||qty<=0)return alert('Cantidad incorrecta');let existing=sum(cart.filter(x=>x.kind===kind&&x.id===id),x=>x.qty);if(kind==='P'&&existing+qty>p.stock)return alert('No hay existencias suficientes');cart.push({kind,id,name:p.name,qty,price:p.price,cost:p.cost});render()}
function cartRemove(i){cart.splice(i,1);render()}
function paymentChange(v){let x=$('mixedFields');if(x)x.style.display=v==='Mixto'?'block':'none'}
function checkout(e){e.preventDefault();if(!cart.length)return alert('Agrega artículos o servicios');let f=e.target.elements,method=f.method.value,total=Math.round(sum(cart,x=>x.qty*x.price)*100)/100;let parts={Efectivo:0,Transferencia:0,Tarjeta:0};if(method==='Mixto'){parts.Efectivo=Number(f.cashAmount.value);parts.Transferencia=Number(f.transferAmount.value);parts.Tarjeta=Number(f.cardAmount.value);if(Object.values(parts).some(x=>!Number.isFinite(x)||x<0)||Math.abs(sum(Object.values(parts),x=>x)-total)>.009)return alert('Los pagos mixtos deben sumar exactamente '+money(total))}else parts[method]=total;for(let x of cart){let p=(x.kind==='P'?db.products:db.services).find(y=>y.id===x.id);if(!p||(x.kind==='P'&&x.qty>p.stock))return alert('Stock insuficiente o artículo eliminado: '+x.name)}let date=timestamp(),receiptId=uid(),remaining={...parts};cart.forEach((x,i)=>{let p=(x.kind==='P'?db.products:db.services).find(y=>y.id===x.id),amount=Math.round(x.qty*x.price*100)/100,costTotal=Math.round(x.qty*x.cost*100)/100,alloc={};for(let m of Object.keys(parts)){alloc[m]=i===cart.length-1?remaining[m]:Math.round(parts[m]*amount/(total||1)*100)/100;if(total===0)alloc[m]=0;remaining[m]=Math.round((remaining[m]-alloc[m])*100)/100}let s={id:uid(),receiptId,date,kind:x.kind==='S'?'service':'product',productId:x.id,name:x.name,qty:x.qty,method, seller:f.seller.value.trim()||'Principal',total:amount,costTotal,profit:amount-costTotal,refundQty:0,refundTotal:0,refundCost:0,paymentCash:method==='Mixto'?alloc.Efectivo:0,paymentTransfer:method==='Mixto'?alloc.Transferencia:0,paymentCard:method==='Mixto'?alloc.Tarjeta:0};db.sales.push(s);if(x.kind==='P'){p.stock-=x.qty;db.inventory.push({id:uid(),date,productId:p.id,name:p.name,type:'venta',qty:-x.qty,cost:x.cost,saleId:s.id})}});if(parts.Efectivo>0)db.cash.push({id:uid(),date,type:'entrada',amount:parts.Efectivo,concept:'Venta comprobante '+receiptId,receiptId});cart=[];save();render();alert('Comprobante registrado: '+money(total))}
function addProduct(e){e.preventDefault();const f=e.target.elements;let p={id:f.id.value.trim(),name:f.name.value.trim(),category:f.category.value.trim(),price:num(f.price.value),cost:num(f.cost.value),stock:num(f.stock.value),min:num(f.min.value)};if(!p.id||!p.name||db.products.some(x=>x.id===p.id)||!Number.isInteger(p.stock)||!Number.isInteger(p.min)||Object.values(p).some(v=>typeof v==='number'&&(!Number.isFinite(v)||v<0)))return alert('Datos inválidos o código duplicado');db.products.push(p);if(p.stock)db.inventory.push({id:uid(),date:timestamp(),productId:p.id,name:p.name,type:'inicio',qty:p.stock,cost:p.cost});save();render()}
function adjust(e){e.preventDefault();let f=e.target.elements,p=db.products.find(x=>x.id===f.id.value),qty=num(f.qty.value),type=f.type.value,delta=type==='entrada'?qty:-qty;if(!p||!Number.isInteger(qty)||qty<=0||p.stock+delta<0)return alert('Cantidad inválida o existencia insuficiente');p.stock+=delta;db.inventory.push({id:uid(),date:timestamp(),productId:p.id,name:p.name,type,qty:delta,cost:p.cost,concept:f.concept.value});save();render()}
function bulkPrice(e){e.preventDefault();const v=Number(e.target.elements.percent.value);if(!Number.isFinite(v)||v<=-100||v>1000)return alert('Porcentaje inválido');if(!confirm('¿Modificar el precio de TODOS los productos en '+v+'%?'))return;db.settings??={business:'Mi negocio',currency:'CUP'};db.products.forEach(p=>p.price=Math.round(p.price*(1+v/100)*100)/100);save();render()}
function sell(e){e.preventDefault();let f=e.target.elements,p=db.products.find(x=>x.id===f.id.value),qty=num(f.qty.value),method=f.method.value;if(!p||!Number.isInteger(qty)||qty<=0||qty>p.stock||!['Efectivo','Transferencia','Tarjeta'].includes(method))return alert('Existencia insuficiente');let date=timestamp(),total=Math.round(p.price*qty*100)/100,costTotal=Math.round(p.cost*qty*100)/100,s={id:uid(),date,productId:p.id,name:p.name,qty,method,seller:f.seller.value.trim()||'Principal',total,costTotal,profit:total-costTotal,refundQty:0,refundTotal:0,refundCost:0};db.sales.push(s);p.stock-=qty;db.inventory.push({id:uid(),date,productId:p.id,name:p.name,type:'venta',qty:-qty,cost:p.cost,saleId:s.id});if(method==='Efectivo')db.cash.push({id:uid(),date,type:'entrada',amount:total,concept:'Venta '+s.id,saleId:s.id});save();render();alert('Venta registrada: '+money(total))}
function refund(e){e.preventDefault();let f=e.target.elements,s=db.sales.find(x=>x.id===f.id.value),q=Number(f.qty.value);if(!s||!Number.isInteger(q)||q<=0||q>s.qty-s.refundQty)return alert('Cantidad inválida');let p=db.products.find(x=>x.id===s.productId);if(!p&&s.kind!=='service')return alert('Producto original no encontrado');let final=q===s.qty-s.refundQty,amt=final?Math.round((num(s.total)-num(s.refundTotal))*100)/100:Math.round(num(s.total)*q/s.qty*100)/100,ct=final?Math.round((num(s.costTotal)-num(s.refundCost))*100)/100:Math.round(num(s.costTotal)*q/s.qty*100)/100;
let allocation={Efectivo:0,Transferencia:0,Tarjeta:0};const base={Efectivo:s.method==='Mixto'?num(s.paymentCash):s.method==='Efectivo'?num(s.total):0,Transferencia:s.method==='Mixto'?num(s.paymentTransfer):s.method==='Transferencia'?num(s.total):0,Tarjeta:s.method==='Mixto'?num(s.paymentCard):s.method==='Tarjeta'?num(s.total):0};let old={Efectivo:0,Transferencia:0,Tarjeta:0};(s.refunds||[]).forEach(r=>{Object.keys(old).forEach(m=>old[m]+=num(r.allocation?.[m]??(r.method===m?r.amount:0)))});let remain=amt;for(const m of ['Efectivo','Transferencia','Tarjeta']){let available=Math.round((base[m]-old[m])*100)/100;let share=final?available:Math.min(available,Math.round(base[m]*q/s.qty*100)/100);allocation[m]=Math.max(0,share);remain=Math.round((remain-allocation[m])*100)/100}if(Math.abs(remain)>.009){for(const m of ['Efectivo','Transferencia','Tarjeta']){let room=Math.round((base[m]-old[m]-allocation[m])*100)/100,extra=Math.min(room,remain);if(extra>0){allocation[m]+=extra;remain=Math.round((remain-extra)*100)/100}}}if(Math.abs(remain)>.009)return alert('No se pudo distribuir la devolución por medios de pago');if(allocation.Efectivo>totals().cash+.009)return alert('Efectivo insuficiente para devolver; registre primero un ingreso a caja o reembolse por otro procedimiento autorizado');
let date=timestamp(),rid=uid(),event={id:rid,saleId:s.id,receiptId:s.receiptId||s.id,date,qty:q,amount:amt,cost:ct,allocation};s.refundQty+=q;s.refundTotal=Math.round((s.refundTotal+amt)*100)/100;s.refundCost=Math.round((s.refundCost+ct)*100)/100;s.refunds??=[];s.refunds.push(event);db.refundEvents.push(event);if(p){p.stock+=q;db.inventory.push({id:uid(),date,productId:p.id,name:p.name,type:'devolucion',qty:q,cost:ct/q,saleId:s.id,refundId:rid})}if(allocation.Efectivo)db.cash.push({id:uid(),date,type:'salida',amount:allocation.Efectivo,concept:'Devolución '+s.id,refundId:rid});for(const m of ['Transferencia','Tarjeta'])if(allocation[m])db.bank.push({id:uid(),date,type:'salida',amount:allocation[m],concept:'Reembolso '+m+' '+s.id,refundId:rid,method:m,confirmed:false});save();render()}
function auditCash(e){e.preventDefault();const f=e.target.elements,counted=Number(f.counted.value),operator=f.operator.value.trim();if(!Number.isFinite(counted)||counted<0||!operator)return alert('Introduce un conteo válido y responsable');const expected=totals().cash;db.audits.push({id:uid(),date:timestamp(),operator,counted,expected,difference:Math.round((counted-expected)*100)/100});save();render()}function cashMove(e){e.preventDefault();let f=e.target.elements,amount=Number(f.amount.value);if(!Number.isFinite(amount)||amount<=0||f.type.value==='salida'&&amount>totals().cash)return alert('Importe inválido o caja insuficiente');db.cash.push({id:uid(),date:timestamp(),type:f.type.value,amount,concept:f.concept.value.trim()});save();render()}
function bankMove(e){e.preventDefault();let f=e.target.elements,amount=Number(f.amount.value);if(!Number.isFinite(amount)||amount<=0)return alert('Importe inválido');db.bank.push({id:uid(),date:timestamp(),type:f.type.value,amount,concept:f.concept.value.trim()});save();render()}
function addExpense(e){e.preventDefault();let f=e.target.elements,amount=Number(f.amount.value),method=f.method.value,date=timestamp(),id=uid();if(!Number.isFinite(amount)||amount<=0||method==='Efectivo'&&amount>totals().cash)return alert('Importe inválido o efectivo insuficiente');db.expenses.push({id,date,amount,method,concept:f.concept.value.trim(),category:f.category.value.trim()});if(method==='Efectivo')db.cash.push({id:uid(),date,type:'salida',amount,concept:'Gasto: '+f.concept.value,expenseId:id});if(method==='Banco')db.bank.push({id:uid(),date,type:'salida',amount,concept:'Gasto: '+f.concept.value,expenseId:id});save();render()}
function addReservation(e){e.preventDefault();let f=e.target.elements,date=f.date.value,time=f.time.value,duration=num(f.duration.value),resource=f.resource.value.trim(),start=Date.parse(date+'T'+time),end=start+duration*60000;if(!Number.isFinite(start)||duration<=0||!resource)return alert('Datos inválidos');let overlap=db.reservations.some(r=>r.status!=='Cancelada'&&r.resource.toLowerCase()===resource.toLowerCase()&&start<Date.parse(r.date+'T'+r.time)+r.duration*60000&&end>Date.parse(r.date+'T'+r.time));if(overlap)return alert('El recurso ya está reservado en ese horario');db.reservations.push({id:uid(),client:f.client.value,resource,date,time,duration,status:'Confirmada'});save();render()}
function toggleReservation(id){let r=db.reservations.find(x=>x.id===id);if(!r)return;if(r.status==='Cancelada'){let start=Date.parse(r.date+'T'+r.time),end=start+r.duration*60000;if(db.reservations.some(x=>x.id!==id&&x.status!=='Cancelada'&&x.resource.toLowerCase()===r.resource.toLowerCase()&&start<Date.parse(x.date+'T'+x.time)+x.duration*60000&&end>Date.parse(x.date+'T'+x.time)))return alert('Conflicto con otra reserva')}r.status=r.status==='Cancelada'?'Confirmada':'Cancelada';save();render()}
function changeRange(){from=$('from').value;to=$('to').value;if(from&&to&&from>to){alert('La fecha inicial no puede superar la final');return}render()}function changeReport(){report=$('rtype').value;render()}
function periodSales(){const original=db.sales.filter(inRange).map(s=>({...s,refundQty:0,refundTotal:0,refundCost:0}));const refunds=db.sales.flatMap(s=>(s.refunds||[]).filter(inRange).map(r=>({id:r.id,date:r.date,receiptId:s.receiptId,kind:s.kind,productId:s.productId,name:'DEVOLUCIÓN: '+s.name,qty:-num(r.qty),method:'Mixto',seller:s.seller,total:-num(r.amount),costTotal:-num(r.cost),refundQty:0,refundTotal:0,refundCost:0,paymentCash:-num(r.allocation?.Efectivo),paymentTransfer:-num(r.allocation?.Transferencia),paymentCard:-num(r.allocation?.Tarjeta)})));return original.concat(refunds)}
function paidBy(s,m){if(s.method===m)return num(s.total);return num(s[m==='Efectivo'?'paymentCash':m==='Transferencia'?'paymentTransfer':'paymentCard'])}
function reportData(){const ss=periodSales(),ex=expenses(),revenue=sum(ss,s=>num(s.total)),cogs=sum(ss,s=>num(s.costTotal)),gross=revenue-cogs,oper=sum(ex,x=>num(x.amount)),profit=gross-oper;let title='',heads=[],rows=[];switch(report){case'devoluciones':title='Devoluciones por fecha efectiva';heads=['Fecha','Venta original','Cantidad','Reembolso efectivo','Reembolso transferencia','Reembolso tarjeta','Total devuelto'];rows=db.refundEvents.filter(inRange).map(r=>[esc(r.date.slice(0,10)),esc(r.saleId),r.qty,money(r.allocation?.Efectivo),money(r.allocation?.Transferencia),money(r.allocation?.Tarjeta),money(r.amount)]);break;case'ventas':title='Ventas por fecha y medio de pago';heads=['Fecha','Producto','Cantidad neta','Pago','Vendedor','Venta neta'];rows=ss.map(s=>[esc(s.date.slice(0,10)),esc(s.name),s.qty-s.refundQty,esc(s.method),esc(s.seller||'Sin asignar'),money(net(s))]);break;case'productos':{title='Ventas por producto';heads=['Producto','Unidades netas','Ingresos','Costo','Margen bruto'];let map=new Map();ss.filter(s=>s.kind!=='service').forEach(s=>{let v=map.get(s.productId)||{name:s.name,qty:0,rev:0,cost:0};v.qty+=s.qty-s.refundQty;v.rev+=net(s);v.cost+=cost(s);map.set(s.productId,v)});rows=[...map.values()].sort((a,b)=>b.rev-a.rev).map(v=>[esc(v.name),v.qty,money(v.rev),money(v.cost),money(v.rev-v.cost)]);break}case'servicios':{title='Ventas y rentabilidad por servicio';heads=['Servicio','Unidades','Ingresos','Costos directos','Margen bruto'];let map=new Map();ss.filter(s=>s.kind==='service').forEach(s=>{let v=map.get(s.productId)||{name:s.name,qty:0,rev:0,cost:0};v.qty+=s.qty-s.refundQty;v.rev+=net(s);v.cost+=cost(s);map.set(s.productId,v)});rows=[...map.values()].map(v=>[esc(v.name),v.qty,money(v.rev),money(v.cost),money(v.rev-v.cost)]);rows.push(['TOTAL','',money(sum(ss.filter(s=>s.kind==='service'),net)),money(sum(ss.filter(s=>s.kind==='service'),cost)),money(sum(ss.filter(s=>s.kind==='service'),s=>net(s)-cost(s)))]);break}case'existencias':title='Existencias actuales y valoración';heads=['Código','Producto','Categoría','Unidades','Costo unitario','Valor al costo','Valor de venta'];rows=db.products.map(p=>[esc(p.id),esc(p.name),esc(p.category),p.stock,money(p.cost),money(p.cost*p.stock),money(p.price*p.stock)]);break;case'ingresos':title='Ingresos por medio de cobro';heads=['Medio','Operaciones','Ingreso neto'];rows=['Efectivo','Transferencia','Tarjeta'].map(m=>{let xs=ss.filter(s=>Math.abs(paidBy(s,m))>.0001);return[m,xs.length,money(sum(xs,s=>paidBy(s,m)))]});rows.push(['TOTAL','',money(revenue)]);break;case'costos':title='Costos directos de productos y servicios';heads=['Producto o servicio','Unidades netas','Costo neto','Ingreso neto','Margen bruto'];rows=ss.map(s=>[esc(s.name),s.qty-s.refundQty,money(cost(s)),money(net(s)),money(net(s)-cost(s))]);rows.push(['TOTAL','',money(cogs),money(revenue),money(gross)]);break;case'gastos':title='Relación de gastos';heads=['Fecha','Concepto','Categoría','Forma de pago','Importe'];rows=ex.map(x=>[esc(x.date.slice(0,10)),esc(x.concept),esc(x.category),esc(x.method),money(x.amount)]);rows.push(['TOTAL','','','',money(oper)]);break;case'resultado':title='Estado de resultados comercial estimado (ajustes por fecha efectiva)';heads=['Concepto','Importe CUP'];rows=[['Ingresos por productos',money(sum(ss.filter(s=>s.kind!=='service'),net))],['Ingresos por servicios',money(sum(ss.filter(s=>s.kind==='service'),net))],['Ingresos netos por ventas',money(revenue)],['(-) Costos directos de bienes y servicios',money(cogs)],['= Utilidad bruta',money(gross)],['(-) Gastos operativos registrados',money(oper)],['= RESULTADO ESTIMADO',money(profit)]];break;case'caja':{title='Efectividad y arqueo de caja';heads=['Concepto','Importe CUP'];let cs=db.cash.filter(inRange),inflows=sum(cs,x=>x.type==='entrada'?num(x.amount):0),outflows=sum(cs,x=>x.type==='salida'?num(x.amount):0),cashSales=sum(ss,s=>paidBy(s,'Efectivo'));rows=[['Cobros netos en efectivo por ventas (informativo; incluidos en entradas y salidas)',money(cashSales)],['Entradas de caja registradas',money(inflows)],['Salidas de caja registradas',money(outflows)],['Movimiento neto de caja en el período',money(inflows-outflows)],['Saldo histórico calculado al momento',money(totals().cash)],['Efectivo físico contado','Pendiente de introducir / conciliar'],['Diferencia de arqueo','No calculable sin conteo físico']];break}case'banco':{title='Cobros electrónicos y movimientos bancarios';heads=['Concepto','Importe CUP'];let trans=sum(ss,s=>paidBy(s,'Transferencia')),card=sum(ss,s=>paidBy(s,'Tarjeta')),bs=db.bank.filter(inRange),ins=sum(bs,x=>x.type==='entrada'?num(x.amount):0),outs=sum(bs,x=>x.type==='salida'&&!x.refundId?num(x.amount):0);rows=[['Ventas netas por transferencias',money(trans)],['Ventas netas por tarjetas',money(card)],['Otros movimientos bancarios de entrada',money(ins)],['Movimientos bancarios de salida',money(outs)],['Movimiento neto registrado en período',money(trans+card+ins-outs)],['Saldo bancario confirmado','Pendiente de conciliación con estado bancario']];break}case'inventario':title='Movimientos de inventario';heads=['Fecha','Producto','Tipo','Variación','Valor al costo'];rows=db.inventory.filter(inRange).map(x=>[esc(x.date.slice(0,10)),esc(x.name),esc(x.type),x.qty,money(Math.abs(x.qty)*num(x.cost))]);break;case'vendedores':{title='Ventas por vendedor';heads=['Vendedor','Operaciones','Venta neta'];let map=new Map();ss.forEach(s=>{let k=s.seller||'Sin asignar',v=map.get(k)||{n:0,total:0};v.n++;v.total+=net(s);map.set(k,v)});rows=[...map.entries()].map(([k,v])=>[esc(k),v.n,money(v.total)]);break}case'arqueos':title='Historial de arqueos de efectivo';heads=['Fecha','Responsable','Teórico','Contado','Diferencia'];rows=db.audits.filter(inRange).map(x=>[esc(x.date.slice(0,10)),esc(x.operator),money(x.expected),money(x.counted),money(x.difference)]);break;case'reservas':title='Reservas registradas';heads=['Fecha','Hora','Cliente','Recurso','Duración','Estado'];rows=db.reservations.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)).map(x=>[esc(x.date),esc(x.time),esc(x.client),esc(x.resource),x.duration+' min',esc(x.status)]);break}return{title,heads,rows,html:`<h2>${esc(title)}</h2><p class="muted">Período: ${esc(from||'inicio')} — ${esc(to||'actualidad')} · Generado: ${new Date().toLocaleString('es-CU')}</p>${table(heads,rows)}<p class="muted">Las devoluciones se registran como ajustes negativos en su fecha efectiva, incluso cuando la venta original ocurrió en otro período. Informe operativo de prueba · No sustituye los registros contables ni la conciliación bancaria.</p>`}}
function printReport(){let d=reportData();$('printArea').innerHTML=`<h1>${esc(db.settings.business||'JB Gestión Empresarial 360')}</h1><h2>${esc(d.title)}</h2><p>Desde: ${esc(from||'inicio')} · Hasta: ${esc(to||'actualidad')} · Fecha de emisión: ${new Date().toLocaleString('es-CU')}</p>${table(d.heads,d.rows)}<p>Elaborado por: ____________________ &nbsp;&nbsp; Revisado por: ____________________</p><p>Reporte operativo de prueba. Los importes bancarios no están conciliados.</p>`;window.print()}
function receipt(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let lines=db.sales.filter(x=>(x.receiptId||x.id)===(s.receiptId||s.id));let methods=['Efectivo','Transferencia','Tarjeta'];let body=lines.map(x=>[esc(x.name),x.qty,x.refundQty,money(net(x))]);let split=methods.map(m=>[m,money(sum(lines,x=>netPayment(x,m)))]);$('printArea').innerHTML=`<h1>${esc(db.settings.business||'JB Gestión Empresarial 360')}</h1><h2>Comprobante de venta (no fiscal)</h2><p>N.º: ${esc(s.receiptId||s.id)}<br>Fecha: ${esc(new Date(s.date).toLocaleString('es-CU'))}</p>${table(['Concepto','Cantidad','Devoluciones','Importe neto'],body)}<p><b>Total neto: ${money(sum(lines,net))}</b></p>${table(['Medio','Cobro neto'],split)}<p>Comprobante comercial sin validez fiscal.</p>`;window.print()}function csvReport(){let d=reportData(),lines=[d.heads,...d.rows.map(r=>r.map(v=>String(v).replace(/<[^>]*>/g,'')))];let csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'jb360-'+report+'-'+today()+'.csv')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download(new Blob([JSON.stringify({app:'jb360-demo',version:7,data:db,actorProfile:JSON.parse(localStorage.getItem('jb360_actor_profile_v08')||'null')},null,2)],{type:'application/json'}),'jb360-respaldo-'+today()+'.json')}
async function restore(e){let file=e.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(v.app!=='jb360-demo'||!Array.isArray(v.data?.products)||!Array.isArray(v.data?.sales)||!Array.isArray(v.data?.cash))throw Error('Formato incorrecto');if(v.data.sales.some(x=>!Number.isFinite(Number(x.total))||Number(x.total)<0)||v.data.products.some(x=>!Number.isFinite(Number(x.stock))||Number(x.stock)<0))throw Error('Importación con valores inválidos');if(!confirm('¿Reemplazar todos los datos actuales?'))return;const old=db;db=v.data;normalize();if(!save()){db=old;return}if(v.actorProfile&&typeof v.actorProfile==='object')localStorage.setItem('jb360_actor_profile_v08',JSON.stringify(v.actorProfile));location.reload()}catch(err){alert('Error al importar: '+err.message)}}function exportAuxBook(kind){const rows=kind==='ingresos'?[['Fecha','Operación','Comprobante','Concepto','Cantidad','Ingreso CUP','Efectivo CUP','Transferencia CUP','Tarjeta CUP'],...periodSales().map(s=>[s.date.slice(0,10),s.total<0?'Devolución':'Venta',s.receiptId||s.id,s.name,s.qty,num(s.total),paidBy(s,'Efectivo'),paidBy(s,'Transferencia'),paidBy(s,'Tarjeta')])]:[['Fecha','Concepto','Categoría','Medio','Importe CUP'],...expenses().map(x=>[x.date.slice(0,10),x.concept,x.category,x.method,num(x.amount)])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'jb360-libro-auxiliar-'+kind+'-'+today()+'.csv')}
function reset(){if(confirm('¿Eliminar los datos locales actuales?')){db=seed();save();render()}}render();
</script><style>#jb-actor{position:relative;z-index:2;background:#e8f3ff;color:#102a43;padding:12px 18px;font:14px system-ui;border-bottom:2px solid #a8cce8}#jb-actor select,#jb-actor input,#jb-actor button{padding:8px;margin:3px;border-radius:6px;border:1px solid #9cb5c8}#jb-actor button{background:#124e78;color:white;cursor:pointer}#jb-actor .note{font-size:12px;color:#334d63}#jb-actor .warning{background:#fff1d5;padding:9px;margin-top:6px;border-radius:5px}#jb-actor table{border-collapse:collapse;width:100%;margin:10px 0}#jb-actor td,#jb-actor th{border:1px solid #a4b6c6;padding:6px;text-align:left}#jb-actor details{margin-top:8px}@media print{#jb-actor button,#jb-actor select,#jb-actor input{display:none!important}}</style>
<script>(function(){'use strict';const K='jb360_actor_profile_v08';const profiles={tcp:{name:'Trabajador por cuenta propia (TCP)',items:['Registro de ingresos y gastos según régimen aplicable','Comprobantes y documentos de respaldo','Tributos y contribuciones determinados por vector fiscal y normas vigentes','Declaración jurada personal cuando corresponda','Obligaciones vinculadas a trabajadores contratados, cuando proceda']},mipyme:{name:'MIPYME (SRL)',items:['Contabilidad empresarial y estados financieros','Impuestos sobre utilidades y demás obligaciones aplicables','Obligaciones sobre salarios y trabajadores','Tributos por operaciones según actividad y tratamiento legal','Obligaciones tributarias de socios separadas de las de la sociedad']},cna:{name:'Cooperativa no agropecuaria (CNA)',items:['Contabilidad de la cooperativa','Tributos aplicables a la cooperativa','Aportes y obligaciones laborales que correspondan','Declaraciones y pagos según régimen vigente']},pdl:{name:'Proyecto de desarrollo local (PDL)',items:['Determinar personalidad jurídica y titular de cada obligación','Registrar operaciones y documentos soporte','Aplicar tributos según forma jurídica, actividad y régimen aprobado','Verificar tratamientos especiales y exenciones solo con norma acreditada']},estatal:{name:'Entidad estatal',items:['Contabilidad y estados financieros según régimen aplicable','Tributos y contribuciones que correspondan','Obligaciones laborales y de seguridad social','Declaraciones y registros según normas específicas']},autonomo:{name:'Autónomo (actividad económica individual)',items:['Identificar modalidad y autorización para ejercer la actividad','Verificar inscripción tributaria y vector fiscal correspondiente','Registrar ingresos, gastos y comprobantes de respaldo','Determinar obligaciones de declaración y pago según régimen aplicable','Comprobar obligaciones por trabajadores contratados cuando corresponda']},otro:{name:'Otro actor económico',items:['Identificar personalidad jurídica y registro tributario','Verificar régimen específico y obligaciones','Habilitar declaraciones solo tras validación normativa']}};function load(){try{return JSON.parse(localStorage.getItem(K))||{actor:'',business:'',nit:'',activity:'',year:new Date().getFullYear()}}catch{return{actor:''}}}let p=load();function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function draw(){let el=document.getElementById('jb-actor');if(!el){el=document.createElement('section');el.id='jb-actor';let header=document.querySelector('header');(header||document.body).insertAdjacentElement(header?'afterend':'afterbegin',el)}const a=profiles[p.actor];el.innerHTML='<strong>Perfil económico y tributario · JB360 v0.8</strong><div><label>Actor: <select id="ja-type"><option value="">Seleccione actor económico</option>'+Object.entries(profiles).map(([k,v])=>'<option value="'+k+'" '+(p.actor===k?'selected':'')+'>'+v.name+'</option>').join('')+'</select></label><label>Negocio: <input id="ja-name" placeholder="Razón social" value="'+esc(p.business)+'"></label><label>NIT: <input id="ja-nit" placeholder="Identificador tributario" value="'+esc(p.nit)+'"></label><label>Actividad: <input id="ja-activity" placeholder="Actividad económica" value="'+esc(p.activity)+'"></label><label>Ejercicio: <input id="ja-year" type="number" min="2000" max="2100" value="'+esc(p.year||new Date().getFullYear())+'"></label><button id="ja-save">Guardar perfil</button></div>'+(a?'<details open><summary><b>Mapa preliminar de obligaciones: '+a.name+'</b></summary><table><thead><tr><th>Materia por revisar</th><th>Estado</th></tr></thead><tbody>'+a.items.map(x=>'<tr><td>'+esc(x)+'</td><td>Requiere validación individual</td></tr>').join('')+'</tbody></table></details>':'<p>Seleccione el actor económico antes de configurar sus obligaciones.</p>')+'<p class="warning"><b>Control fiscal:</b> no se calculan tasas, cuotas, exenciones, vencimientos ni declaraciones oficiales sin norma, ejercicio y régimen verificados. El perfil no certifica cumplimiento.</p><p class="note">Los datos se guardan en este navegador; no se sincronizan automáticamente entre equipos. Los registros comerciales y tributarios deben conciliarse.</p><button id="ja-print">Imprimir ficha de obligaciones</button>';document.getElementById('ja-save').onclick=()=>{p={actor:document.getElementById('ja-type').value,business:document.getElementById('ja-name').value,nit:document.getElementById('ja-nit').value,activity:document.getElementById('ja-activity').value,year:Number(document.getElementById('ja-year').value)};try{localStorage.setItem(K,JSON.stringify(p));if(p.business){db.settings.business=p.business;save();render()}draw()}catch(e){alert('No fue posible guardar el perfil')}};document.getElementById('ja-print').onclick=()=>window.print()}document.addEventListener('DOMContentLoaded',()=>{if(p.business){db.settings.business=p.business;save();render()}draw()})})();</script>
