<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JB360 · Gestión Empresarial</title><style>body{margin:0;font:15px system-ui;background:#f3f6fa;color:#183044}header{background:#123651;color:white;padding:18px}header small{color:#cde}nav{display:flex;gap:6px;overflow:auto;background:#dce7ee;padding:8px}button{cursor:pointer;border:0;background:#176c92;color:white;border-radius:7px;padding:9px 12px}nav button{white-space:nowrap}main{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:15px}input,select{padding:9px;border:1px solid #bbcbd4;border-radius:6px;max-width:100%;box-sizing:border-box}form{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;background:white}td,th{border-bottom:1px solid #dde5ea;padding:9px;text-align:left}th{background:#e9f1f5}.notice{background:#fff2cf;padding:12px;border-left:4px solid #b57b00}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{font-size:25px;font-weight:700}.danger{background:#a33}.muted{color:#596c77}a{color:#176c92}</style></head><body><header><h1>JB360 · Gestión Empresarial</h1><small>Versión piloto web · datos almacenados exclusivamente en este navegador · sin certificación tributaria</small></header><nav id="nav"></nav><main id="app"></main><script>
"use strict";
const tabs=["Panel","Empresa","Productos","Ventas","Gastos","Caja y Banco","Reservas","Libros","Tributos","Informes","Respaldo"];
const key="jb360_piloto_publico_v1";
const initial={empresa:{nombre:"",nit:"",tipo:"TCP"},productos:[],ventas:[],gastos:[],caja:[],reservas:[]};
let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)}
for(const k of Object.keys(initial))if(!(k in data))data[k]=structuredClone(initial[k]);
let current="Panel";const app=document.getElementById("app");
const money=x=>Number(x||0).toLocaleString("es-CU",{minimumFractionDigits:2,maximumFractionDigits:2})+" CUP";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);
const save=()=>{localStorage.setItem(key,JSON.stringify(data));render()};
const field=(name,type="text",placeholder="")=>'<input name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" '+(type==="number"?'step="0.01" min="0"':"")+' required>';
const table=(cols,rows)=>'<div style="overflow:auto"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';
const tr=(cells)=>'<tr>'+cells.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>';
function submit(form,fn){form.addEventListener("submit",e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form));fn(v);form.reset();save()})}
function render(){document.getElementById("nav").innerHTML=tabs.map(t=>'<button data-tab="'+t+'" '+(t===current?'style="background:#0c334b"':'')+'>'+t+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});let h="";
if(current==="Panel"){h='<div class="grid">'+[["Productos",data.productos.length],["Ventas",money(sum(data.ventas,"total"))],["Gastos",money(sum(data.gastos,"importe"))],["Saldo caja/banco",money(sum(data.caja,"importe")+sum(data.ventas,"total")-sum(data.gastos,"importe"))]].map(x=>'<div class="card"><div>'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join("")+'</div><div class="notice">Piloto de uso local: no es una plataforma multiusuario, no transmite declaraciones a la ONAT y no sustituye la revisión contable y fiscal.</div>'}
if(current==="Empresa"){h='<div class="card"><h2>Datos del actor económico</h2><form id="fempresa">'+field("nombre","text","Razón social o nombre") +field("nit","text","NIT")+'<select name="tipo">'+["TCP","MIPYME","CNA","Empresa estatal","Unidad presupuestada","PDL","Otro"].map(t=>'<option '+(data.empresa.tipo===t?"selected":"")+'>'+t+'</option>').join("")+'</select><button>Guardar</button></form><p class="muted">Actual: '+esc(data.empresa.nombre||"Sin configurar")+' · '+esc(data.empresa.tipo)+'</p></div>'}
if(current==="Productos"){h='<div class="card"><h2>Productos e inventario</h2><form id="fproductos">'+field("nombre","text","Producto")+field("precio","number","Precio CUP")+field("stock","number","Existencias")+ '<button>Agregar</button></form></div>'+table(["Producto","Precio","Existencias"],data.productos.map(p=>tr([p.nombre,money(p.precio),p.stock])))}
if(current==="Ventas"){h='<div class="card"><h2>Registrar venta</h2><form id="fventas"><input name="fecha" type="date" required><select name="producto" required>'+data.productos.map((p,i)=>'<option value="'+i+'">'+esc(p.nombre)+' · disponibles '+p.stock+'</option>').join("")+'</select>'+field("cantidad","number","Cantidad")+'<button '+(!data.productos.length?"disabled":"")+'>Registrar</button></form><p id="msg" class="muted"></p></div>'+table(["Fecha","Producto","Cantidad","Total"],data.ventas.map(v=>tr([v.fecha,v.producto,v.cantidad,money(v.total)])))}
if(current==="Gastos"){h='<div class="card"><h2>Registrar gasto</h2><form id="fgastos"><input name="fecha" type="date" required>'+field("concepto","text","Concepto")+field("importe","number","Importe CUP")+'<button>Registrar</button></form></div>'+table(["Fecha","Concepto","Importe"],data.gastos.map(v=>tr([v.fecha,v.concepto,money(v.importe)])))}
if(current==="Caja y Banco"){h='<div class="card"><h2>Movimientos de caja y banco</h2><form id="fcaja"><input name="fecha" type="date" required>'+field("concepto","text","Concepto")+'<select name="cuenta"><option>Caja</option><option>Banco</option></select><input name="importe" type="number" step="0.01" placeholder="Entrada positiva / salida negativa" required><button>Registrar</button></form></div>'+table(["Fecha","Cuenta","Concepto","Importe"],data.caja.map(v=>tr([v.fecha,v.cuenta,v.concepto,money(v.importe)])))}
if(current==="Reservas"){h='<div class="card"><h2>Reservas</h2><form id="freservas"><input name="fecha" type="date" required>'+field("cliente","text","Cliente")+field("detalle","text","Detalle")+'<button>Registrar</button></form></div>'+table(["Fecha","Cliente","Detalle"],data.reservas.map(v=>tr([v.fecha,v.cliente,v.detalle])))}
if(current==="Libros"){h='<div class="card"><h2>Libro auxiliar de ingresos</h2><p>Exportación de los movimientos registrados. No sustituye el modelo oficial ONAT.</p><button id="csvventas">Exportar ingresos CSV</button></div>'+table(["Fecha","Concepto","Ingreso"],data.ventas.map(v=>tr([v.fecha,v.producto,money(v.total)])))+'<div class="card"><h2>Libro auxiliar de gastos</h2><button id="csvgastos">Exportar gastos CSV</button></div>'+table(["Fecha","Concepto","Gasto"],data.gastos.map(v=>tr([v.fecha,v.concepto,money(v.importe)])))}
if(current==="Tributos"){h='<div class="card"><h2>Gestión tributaria — pendiente de validación</h2><div class="notice"><strong>No calcular ni presentar tributos oficiales con esta versión.</strong> No están incorporadas ni verificadas las fórmulas y casillas de los modelos ONAT ni las reglas fiscales por actor económico para 2026.</div><p>Actor registrado: <strong>'+esc(data.empresa.tipo)+'</strong>. Ingresos auxiliares: '+money(sum(data.ventas,"total"))+'. Gastos registrados: '+money(sum(data.gastos,"importe"))+'.</p><p>La aprobación, firma y presentación corresponden al contribuyente o representante autorizado, previa revisión externa.</p><p><a href="https://www.onat.gob.cu/" target="_blank" rel="noopener">Portal oficial de la ONAT</a></p></div>'}
if(current==="Informes"){h='<div class="card"><h2>Resumen operativo</h2>'+table(["Concepto","Total"],[tr(["Ingresos por ventas",money(sum(data.ventas,"total"))]),tr(["Gastos",money(sum(data.gastos,"importe"))]),tr(["Diferencia simple (no utilidad fiscal)",money(sum(data.ventas,"total")-sum(data.gastos,"importe"))]),tr(["Operaciones de ventas",data.ventas.length])])+'</div>'}
if(current==="Respaldo"){h='<div class="card"><h2>Respaldo y restauración</h2><p>Descarga un respaldo JSON y guárdalo en lugar seguro. El almacenamiento local puede borrarse al limpiar el navegador.</p><button id="backup">Descargar respaldo JSON</button><p><input type="file" id="restore" accept=".json,application/json"></p><button id="reset" class="danger">Borrar datos locales</button></div>'}
app.innerHTML=h;
const form=document.querySelector("form");
if(form){if(current==="Empresa")submit(form,v=>data.empresa=v);
if(current==="Productos")submit(form,v=>data.productos.push({...v,precio:Number(v.precio),stock:Number(v.stock)}));
if(current==="Ventas")form.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form)),p=data.productos[Number(v.producto)],q=Number(v.cantidad);if(!p||q<=0||q>p.stock){document.getElementById("msg").textContent="Cantidad inválida o existencias insuficientes";return}p.stock-=q;data.ventas.push({fecha:v.fecha,producto:p.nombre,cantidad:q,total:Number((q*p.precio).toFixed(2))});save()};
if(current==="Gastos")submit(form,v=>data.gastos.push({...v,importe:Number(v.importe)}));
if(current==="Caja y Banco")submit(form,v=>data.caja.push({...v,importe:Number(v.importe)}));
if(current==="Reservas")submit(form,v=>data.reservas.push(v));}
function download(name,txt,type){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([txt],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(rows){return "\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(";")).join("\r\n")}
if(current==="Libros"){document.getElementById("csvventas").onclick=()=>download("JB360_ingresos.csv",csv([["Fecha","Concepto","Ingreso CUP"],...data.ventas.map(v=>[v.fecha,v.producto,v.total])]),"text/csv");document.getElementById("csvgastos").onclick=()=>download("JB360_gastos.csv",csv([["Fecha","Concepto","Gasto CUP"],...data.gastos.map(v=>[v.fecha,v.concepto,v.importe])]),"text/csv")}
if(current==="Respaldo"){document.getElementById("backup").onclick=()=>download("JB360_respaldo.json",JSON.stringify(data,null,2),"application/json");document.getElementById("restore").onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(!v.empresa||!Array.isArray(v.productos)||!Array.isArray(v.ventas)||!Array.isArray(v.gastos))throw Error();if(confirm("¿Reemplazar datos locales?")){data=v;save()}}catch{alert("Archivo de respaldo no válido")}};document.getElementById("reset").onclick=()=>{if(confirm("¿Eliminar definitivamente los datos guardados en este navegador?")){data=structuredClone(initial);save()}}}
}render();
</script></body></html>
